name: ANTuRide
options:
  bundleIdPrefix: com.zjsf
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ANTuRideDomain:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjsf.anturide.domain
        GENERATE_INFOPLIST_FILE: YES

  ANTuRide:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Services
      - path: Sources/Features
      - path: Sources/DesignSystem
      # 资源必须走 sources + buildPhase: resources；target 级 `resources` 键
      # 不生效，会导致 Assets.car 与 PrivacyInfo.xcprivacy 不进包。
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ANTuRideDomain
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 安途
        # 显式声明图标名，与 ASSETCATALOG_COMPILER_APPICON_NAME 一致，
        # 确保 Assets.car 中的 AppIcon 能在系统与应用商店侧被解析。
        CFBundleIconName: AppIcon
        # 关键修复：没有 UILaunchScreen 声明时 iOS 会把 App 按旧分辨率
        # 信箱化渲染（表现为屏幕中间一小块）。空字典即启用系统生成的
        # 启动屏，使 App 全屏铺满真机。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: 连接 ANT BMS 和电机控制器读取电池及运行状态
        NSLocationWhenInUseUsageDescription: 记录速度、里程和行程能耗
        # 阶段 2：未锁屏后台继续记录行程（D3）。配合 WhenInUse 授权，
        # 导航类标准模式；不需要「始终」授权。
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjsf.anturide
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ANTuRideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Tests/UnitTests 同时被 SwiftPM（Package.swift 的 ANTuRideDomainTests）编译，
      # 因此该目录只能放只依赖 ANTuRideDomain 的测试。
      - path: Tests/UnitTests
      # Tests/AppTests 仅由 Xcode 测试 target 编译，可 import App 模块（ANTuRide）。
      - path: Tests/AppTests
    dependencies:
      - target: ANTuRideDomain
      - target: ANTuRide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjsf.anturide.tests
        GENERATE_INFOPLIST_FILE: YES

  ANTuRideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: ANTuRide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjsf.anturide.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ANTuRide

schemes:
  ANTuRide:
    build:
      targets:
        ANTuRide: all
        ANTuRideDomain: all
        ANTuRideTests: [test]
        ANTuRideUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ANTuRideTests
        - ANTuRideUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
