name: Build ANTuRide iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build IPA only; skip automated tests and simulator diagnostics
        type: boolean
        default: false
      only_testing:
        description: 'Optional -only-testing filters, comma separated (e.g. ANTuRideUITests/HomeParameterEditingUITests)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    # 90 分钟是实测留出的余量：HomeParameterEditingUITests 单个方法在 CI 上
    # 需要 150–330 秒（大字号/横屏用例要做几十次滑动），13 个方法合计约 45 分钟，
    # 加上设备构建与单元测试，60 分钟会被顶到上限而整体 cancelled
    # （Run 39906108735 即如此）。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode toolchain
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting ${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check settings source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_settings_contract.py

      - name: Check location lifecycle source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_location_contract.py

      - name: Check dashboard source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_dashboard_contract.py

      - name: Check parameter card source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_parameter_cards_contract.py

      - name: Check Bluetooth separation source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_bluetooth_contract.py

      - name: Check range source contracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: python3 scripts/check_range_contract.py

      - name: Run Swift package tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: swift test

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ANTuRide.xcodeproj \
            -scheme ANTuRide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ANTuRide.app"
          test -d "${APP_PATH}"
          rm -rf build/Payload build/ANTuRide-unsigned.ipa
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/ANTuRide.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/ANTuRide-unsigned.ipa
          if unzip -Z1 build/ANTuRide-unsigned.ipa | grep -q 'embedded.mobileprovision'; then
            echo 'Unsigned artifact unexpectedly contains embedded.mobileprovision' >&2
            exit 1
          fi

      - name: Verify app bundle contents
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ANTuRide.app"
          test -d "${APP_PATH}"
          test -f "${APP_PATH}/Assets.car" || { echo 'Assets.car missing: asset catalog not in resources phase' >&2; exit 1; }
          test -f "${APP_PATH}/PrivacyInfo.xcprivacy" || { echo 'PrivacyInfo.xcprivacy missing: privacy manifest not in resources phase' >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${APP_PATH}/Info.plist")" = "AppIcon"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Info.plist")" = "com.zjsf.anturide"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${APP_PATH}/Info.plist")" = "安途"
          # 实时活动的三条独立断言：缺任意一条都会表现为「能编译但灵动岛不出现」。
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "${APP_PATH}/Info.plist")" = "true" \
            || { echo 'NSSupportsLiveActivities missing from app Info.plist' >&2; exit 1; }
          APPEX="${APP_PATH}/PlugIns/ANTuRideLiveActivity.appex"
          test -d "${APPEX}" || { echo 'Live Activity appex missing: extension not embedded into PlugIns' >&2; exit 1; }
          test -f "${APPEX}/PrivacyInfo.xcprivacy" || { echo 'appex privacy manifest missing' >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${APPEX}/Info.plist")" = "com.apple.widgetkit-extension" \
            || { echo 'appex is not a widgetkit extension' >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APPEX}/Info.plist")" = "com.zjsf.anturide.liveactivity"
          # 版本号必须与宿主一致：缺失时能编译、能打包，只在安装阶段失败
          # （bundleVersion must be set in placeholder attributes）。
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP_PATH}/Info.plist")"
          APPEX_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APPEX}/Info.plist" 2>/dev/null || echo missing)"
          test "${APPEX_VERSION}" = "${APP_VERSION}" \
            || { echo "appex CFBundleVersion (${APPEX_VERSION}) != app (${APP_VERSION})" >&2; exit 1; }
          APP_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_PATH}/Info.plist")"
          APPEX_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APPEX}/Info.plist" 2>/dev/null || echo missing)"
          test "${APPEX_SHORT_VERSION}" = "${APP_SHORT_VERSION}" \
            || { echo "appex CFBundleShortVersionString (${APPEX_SHORT_VERSION}) != app (${APP_SHORT_VERSION})" >&2; exit 1; }

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANTuRide-unsigned-ipa
          path: build/ANTuRide-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Run iOS simulator tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted|Shutdown/ { print $2; exit }')"
          if [ -z "${DEVICE_ID}" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          mkdir -p build/test-results
          # 可选子集运行：UI 测试单个类在 CI 上要跑十几分钟，逐类排查时
          # 用 only_testing 输入避免每轮都跑满全部用例。默认空值即全量。
          FILTERS=""
          if [ -n "${{ inputs.only_testing }}" ]; then
            IFS=',' read -r -a ITEMS <<< "${{ inputs.only_testing }}"
            for item in "${ITEMS[@]}"; do
              FILTERS="${FILTERS} -only-testing:${item}"
            done
            echo "only-testing:${FILTERS}"
          fi
          xcodebuild test \
            -project ANTuRide.xcodeproj \
            -scheme ANTuRide \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -resultBundlePath build/test-results/ANTuRide.xcresult \
            CODE_SIGNING_ALLOWED=NO ${FILTERS} 2>&1 | tee build/test-results/xcodebuild.log

      - name: Export simulator test diagnostics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.build_only) }}
        run: |
          if [ -d build/test-results/ANTuRide.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path build/test-results/ANTuRide.xcresult \
              > build/test-results/summary.json || true
            xcrun xcresulttool export attachments \
              --path build/test-results/ANTuRide.xcresult \
              --output-path build/test-results/attachments || true
          fi

      - name: Upload simulator test diagnostics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.build_only) }}
        uses: actions/upload-artifact@v4
        with:
          name: ANTuRide-test-diagnostics
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7
