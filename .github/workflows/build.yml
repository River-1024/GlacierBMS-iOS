name: Build GlacierBMS iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode toolchain
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting ${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift package tests
        run: swift test

      - name: Run iOS simulator tests
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted|Shutdown/ { print $2; exit }')"
          if [ -z "${DEVICE_ID}" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project GlacierBMS.xcodeproj \
            -scheme GlacierBMS \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project GlacierBMS.xcodeproj \
            -scheme GlacierBMS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/GlacierBMS.app"
          test -d "${APP_PATH}"
          rm -rf build/Payload build/GlacierBMS-unsigned.ipa
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/GlacierBMS.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/GlacierBMS-unsigned.ipa
          if unzip -Z1 build/GlacierBMS-unsigned.ipa | grep -q 'embedded.mobileprovision'; then
            echo 'Unsigned artifact unexpectedly contains embedded.mobileprovision' >&2
            exit 1
          fi

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlacierBMS-unsigned-ipa
          path: build/GlacierBMS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
